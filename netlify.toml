# Inert config — committed so deployment is a one-step job later.
# Nothing is published from this repo yet (deploy deferred by request).
#
# When deploy resumes, set these in the Netlify UI under
# Site configuration -> Environment variables:
#   DATA_SOURCE                     mock | supabase
#   MOCK_SECRET                     (random string, mock mode only)
#   NEXT_PUBLIC_SUPABASE_URL        (supabase mode only)
#   NEXT_PUBLIC_SUPABASE_ANON_KEY   (supabase mode only)

[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"
